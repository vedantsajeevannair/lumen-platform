# Render blueprint — the frontend only.
#
# The backend and the AI service run together on an Oracle Cloud Always Free
# ARM instance (nginx in front of Express on :4000 and FastAPI on :8100), so
# Render hosts nothing but the built Vite bundle.
#
# The app calls its API with relative paths ("/api/...", "/uploads/..."), so
# the two rewrites below hand those to the Oracle box server-side. The browser
# only ever talks to the Render origin, which means no CORS preflight, no
# mixed-content block, and the httpOnly session cookie stays first-party.
#
# The last rule is the single-page-app fallback: any path that is not a real
# file is served index.html so client-side routing works on a hard refresh.
services:
  - type: web
    runtime: static
    name: lumen-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://140-238-246-75.sslip.io/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://140-238-246-75.sslip.io/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
